name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            curl -sSL https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-9.1.0/bin/gradle wrapper --gradle-version 9.1.0
            chmod +x ./gradlew
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: location-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
